spring:
  application:
    name: biblioteca-modelo-itspa
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/biblioteca_modelo}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
server:
  port: ${SERVER_PORT:8080}
