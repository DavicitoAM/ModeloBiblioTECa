spring:
  application:
    name: biblioteca-modelo-itspa
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/modeloBiblioteca}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:}
    hikari:
      connection-init-sql: SET TIME ZONE 'America/Mexico_City'
  jackson:
    time-zone: America/Mexico_City
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      cookie:
        http-only: true
        same-site: strict
